<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isometric Antalya</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe9ea; font-family: system-ui, sans-serif; }

    #hud a { color: inherit; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">Isometric Antalya — scroll to zoom. Map data © OpenStreetMap contributors.</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
